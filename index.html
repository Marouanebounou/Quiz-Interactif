<!DOCTYPE html>
<html>
    <head>
    <meta charset="utf-8">
    <title>Quiz Interactif</title>
    <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="container">
            <section id="accueil" class="Home">
                <div class="page">
                    <img src="./images/quiz.png" class="logo">
                    <h1>Quiz Interactif</h1>
                    <p>Choisissez une categorie:</p>
                    
                    <div class="choix">
                        <button class="choix1">Java</button>
                        <button class="choix2">JavaScript</button>
                        <button class="choix3">CSS</button>
                        <button class="choix4">HTML</button>
                    </div>
                </div>
            </section>
            
            <section class="Quiz">
                <div class="page">
                        <img src="./images/quiz.png" class="logo">
                        <h1>Quiz Interactif</h1>
                        <p>Question NR 1 :</p>
                        <p class="score">Score : 0/0</p>
                        <p class="question" id="question"></p>
    
                    <div class="choix">
                        <button class="option">Héritage</button>
                        <button class="option">Encapsulation</button>
                        <button class="option">Polymorphisme</button>
                        <button class="option">Compilation</button>

                    </div>
                </div>
            </section>
            <section class="Resultat">
            </section>
        </div>
        <script src="script.js"></script>
    </body>
</html>
