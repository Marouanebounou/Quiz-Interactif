<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quiz Interactif</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">

    <!-- QUIZ PAGE -->
    <section class="quiz">
      <div class="page">
        <h1>Quiz Interactif</h1>

        <p id="element"></p>

        <div class="score-div">
          <p>Score:</p>
          <p class="correct-score">0</p>
          <p>of</p>
          <p id="total-score">0</p>
        </div>

        <div class="choix">
          <button class="choice"></button>
          <button class="choice"></button>
          <button class="choice"></button>
          <button class="choice"></button>
        </div>

        <button class="finish hidden">Finish</button>
      </div>
    </section>

    <!-- RESULT PAGE -->
    <section class="pageFinal hidden">
      <div class="page">
        <h1>Quiz Terminé</h1>

        <div class="score-div">
          <p>Score:</p>
          <p class="final-score">0</p>
          <p>of</p>
          <p id="final-total-score">10</p>
        </div>

        <h2 id="pourcentage">Score: 0%</h2>

        <button class="replay">Recommencer</button>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
