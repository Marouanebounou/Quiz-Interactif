<!DOCTYPE html>
<html>
    <head>
    <meta charset="utf-8">
    <title>Quiz Interactif</title>
    <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="container">
            <section id="accueil" class="Home">
                <div class="page">
                    <img src="./images/quiz.png" class="logo">
                    <h1>Quiz Interactif</h1>
                    <p>Choisissez une categorie:</p>
                    
                    <div class="choix">
                        <button class="choix1">Java</button>
                        <button class="choix2">JavaScript</button>
                        <button class="choix3">CSS</button>
                        <button class="choix4">HTML</button>
                    </div>
                </div>
            </section>
            
            <section class="Quiz">
                <div class="page">
                        <img src="./images/quiz.png" class="logo">
                        <h1>Quiz Interactif</h1>
                        <p>Question NR 1 :</p>
                        <p>Score : 0/0</p>
                        <p>Lequel des éléments suivants n’est pas un concept POO en Java?</p>
    
                    <div class="choix">
                        <button class="choix1">Héritage</button>
                        <button class="choix2">Encapsulation</button>
                        <button class="choix3">Polymorphisme</button>
                        <button class="choix4">Compilation</button>

                    </div>
                </div>
            </section>
            <section class="Resultat">
            </section>
            <section class="pageFinal">
                <div class="score">
                    <img src="./images/quiz.png">
                    <h1>Quiz Interactif</h1>
                    <h1 id="finQuiz">Quiz Termine !</h1>
                    <h1 id="scoreQuiz">3/10</h1>
                    <h1 id="pourcentage">Score: 30%</h1>
                    <button class="replay"><img src="./images/replay.png" alt="">Recommencer</button>
                    <button class="quittez"><img src="./images/quitter.png" alt="">QUITTER</button>
                </div>
            </section>
        </div>
    </body>
</html>
