<!DOCTYPE html>
<html>
    <head>
    <meta charset="utf-8">
    <title>Quiz Interactif</title>
    <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="container">
            <section id="accueil" class="home">
                <div class="page">
                    <img src="./images/quiz.png" class="logo">
                    <h1>Quiz Interactif</h1>
                    <p>Choisissez une categorie:</p>
                    
                    <div class="choix">
                        <button class="choix1">Java</button>
                        <button class="choix2">JavaScript</button>
                        <button class="choix3">CSS</button>
                        <button class="choix4">HTML</button>
                    </div>
                </div>
            </section>
            
            <section class="quiz">
                <div class="page">
                        <img src="./images/quiz.png" class="logo">
                        <h1>Quiz Interactif</h1>
                        <div class="para">
                            <p>Question NR 1 :</p>
                            <p>Score : 0/0</p>
                        </div>
                        <p id = element>Lequel des éléments suivants n'est pas un concept POO en Java?</p>
    
                    <div class="choix">
                        <button class="choix1">Héritage</button>
                        <button class="choix2">Encapsulation</button>
                        <button class="choix3">Polymorphisme</button>
                        <button class="choix4">Compilation</button>

                    </div>
                </div>
            </section>
            <section class="Resultat">
            </section>
        </div>
    </body>
</html>
